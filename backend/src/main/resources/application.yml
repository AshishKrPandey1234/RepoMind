spring:
  application:
    name: repomind-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${REPOMIND_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        collection-name: ${REPOMIND_CHROMA_COLLECTION:repomind-code-chunks}
        initialize-schema: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            client-name: GitHub
            provider: github
            authorization-grant-type: authorization_code
            redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/login/oauth2/code/github}
            scope:
              - read:user
              - public_repo
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: RepoMind API
    milestone: repository-indexing-foundation

repomind:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  ai:
    embedding-model: ${REPOMIND_EMBEDDING_MODEL:nomic-embed-text}
    chat-model: ${REPOMIND_CHAT_MODEL:}
    embedding-batch-size: ${REPOMIND_EMBEDDING_BATCH_SIZE:32}
    chroma-collection: ${REPOMIND_CHROMA_COLLECTION:repomind-code-chunks}
  indexing:
    max-files: ${INDEX_MAX_FILES:500}
    max-file-bytes: ${INDEX_MAX_FILE_BYTES:262144}
    max-total-bytes: ${INDEX_MAX_TOTAL_BYTES:10485760}
    max-tree-entries: ${INDEX_MAX_TREE_ENTRIES:100000}
    max-access-check-pages: ${INDEX_MAX_ACCESS_CHECK_PAGES:20}
    chunk-chars: ${INDEX_CHUNK_CHARS:1600}
    chunk-overlap-chars: ${INDEX_CHUNK_OVERLAP_CHARS:200}
    max-active-jobs-per-user: ${INDEX_MAX_ACTIVE_JOBS_PER_USER:2}
    max-duration-seconds: ${INDEX_MAX_DURATION_SECONDS:600}
    executor:
      core-pool-size: ${INDEX_WORKER_CORE_POOL_SIZE:1}
      max-pool-size: ${INDEX_WORKER_MAX_POOL_SIZE:2}
      queue-capacity: ${INDEX_WORKER_QUEUE_CAPACITY:4}
